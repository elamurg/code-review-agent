# Local semgrep rules. Kept in the repo, not fetched from the registry, because the
# sandbox has no network. Chosen to complement bandit rather than repeat it: each rule
# here is a pattern bandit misses or reports too noisily.
rules:
  - id: sql-built-with-string-formatting
    languages: [python]
    severity: ERROR
    message: SQL built with string formatting is open to injection; pass parameters separately.
    metadata:
      confidence: MEDIUM
    pattern-either:
      - pattern: $CURSOR.execute(f"...", ...)
      - pattern: $CURSOR.execute("..." % $ARGS, ...)
      - pattern: $CURSOR.execute("...".format(...), ...)
      - pattern: $CURSOR.execute("..." + $X, ...)

  - id: requests-tls-verification-disabled
    languages: [python]
    severity: ERROR
    message: TLS certificate verification is disabled, which allows man-in-the-middle attacks.
    metadata:
      confidence: HIGH
    pattern-either:
      - pattern: requests.$METHOD(..., verify=False, ...)
      - pattern: httpx.$METHOD(..., verify=False, ...)

  - id: jwt-decoded-without-verification
    languages: [python]
    severity: ERROR
    message: JWT decoded without verifying its signature, so any token is accepted.
    metadata:
      confidence: HIGH
    pattern-either:
      - pattern: |
          jwt.decode(..., options={..., "verify_signature": False, ...}, ...)
      - pattern: jwt.decode(..., verify=False, ...)

  - id: flask-debug-enabled
    languages: [python]
    severity: WARNING
    message: Flask debug mode exposes an interactive debugger that can run arbitrary code.
    metadata:
      confidence: MEDIUM
    pattern: $APP.run(..., debug=True, ...)

  - id: insecure-temp-file
    languages: [python]
    severity: WARNING
    message: tempfile.mktemp is racy; use NamedTemporaryFile or mkstemp.
    metadata:
      confidence: HIGH
    pattern: tempfile.mktemp(...)

  - id: path-traversal-in-send-file
    languages: [python]
    severity: WARNING
    message: A user-controlled path passed to send_file can read any file; use send_from_directory.
    metadata:
      confidence: LOW
    pattern: flask.send_file(request.$ATTR.get(...), ...)
