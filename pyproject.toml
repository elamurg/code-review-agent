[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "code-review-agent"
version = "0.1.0"
description = "An automated pull request reviewer that posts structured, grounded review comments on GitHub."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "uvicorn",
    "fastapi",
    "psycopg[binary]",
    "redis",
    "neo4j",
]

[project.optional-dependencies]
# The deterministic analysers. Installed in the sandbox image and for local runs.
# semgrep is deliberately not here: it pins many of its own dependencies exactly, and
# installed alongside the app it forces fastapi down to an old version (or, with pip,
# fails to resolve at all). Install it as an isolated tool: pipx install semgrep.
analysis = [
    "ruff>=0.16.9",
    "mypy>=2.3.1",
    "bandit",
    "pip-audit",
]
dev = [
    "code-review-agent[analysis]",
    "pytest",
    "pre-commit",
]

[tool.setuptools.package-data]
"reviewer.analysis" = ["rules/*.yml"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Deliberately broken code for the analysers, and third-party code in the golden set.
extend-exclude = ["tests/fixtures", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
exclude = ["^tests/fixtures/"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# Slow or external tests are opt-in: pytest -m docker, pytest -m network.
addopts = "-m 'not docker and not network'"
markers = [
    "docker: needs a Docker daemon; builds the reviewer-analysers image if missing",
    "network: talks to external services such as the vulnerability database",
]
