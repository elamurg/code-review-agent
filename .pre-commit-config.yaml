# The golden set stores third-party diffs and files byte for byte. The whitespace hooks
# would "fix" them and corrupt the diffs, so it is excluded from every hook.
exclude: ^data/golden/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        args: [--config-file=pyproject.toml]
        pass_filenames: false
        additional_dependencies:
        - fastapi
        - psycopg
        - redis
        - neo4j
        - pytest
